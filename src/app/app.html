<app-header [bookmarks]="bookmarks()" (addBookmarkEvent)="addBookmark($event)" />
<main>
  @if (!isSuccess()) {
  <app-overview
    [bookmarks]="bookmarks()"
    (onDeleteEvent)="onClickDelete($event)"
    (onUpdateEvent)="onClickUpdate($event)"
  />
  } @else {
  <app-results [newlyAddedURL]="bookmark()" (goBackEvent)="goBack()" />
  }
</main>
